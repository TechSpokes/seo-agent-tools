name: Feature request
description: Propose a public skill, recipe, contract, validation, or delivery improvement
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Decision or maintenance problem
      description: What real task cannot be handled clearly by the current public contract?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Likely area
      options:
        - Runtime instruction
        - Recipe
        - Discovery taxonomy or capability
        - Result contract
        - Validation or testing
        - Installation or release delivery
        - Documentation
        - Unsure
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and representative case
      description: Describe a public-safe example and the observable outcome a change should enable.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and compatibility
      description: Note affected recipe versions, result contracts, server capabilities, privacy, cost, or deferred private machinery.
