name: Skill run feedback
description: Share one factual observation from using SEO Agent Tools
title: "[Feedback]: "
labels:
  - feedback
body:
  - type: textarea
    id: observation
    attributes:
      label: What happened?
      description: One factual observation is enough. Describe what the skill did, missed, or made difficult.
      placeholder: The skill...
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Relevant context
      description: Add the intended outcome, public-safe prompt facts, server-visible behavior, environment, and impact when useful.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the observable behavior you expected and why.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public disclosure check
      options:
        - label: I reviewed this exact report and removed credentials, private identities, local paths, customer data, and private server material.
          required: true
