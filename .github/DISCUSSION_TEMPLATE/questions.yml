title: "Question"
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Ask about installing, using, or contributing to SEO Agent Tools.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation and updates
        - Activation and routing
        - SEO MCP server interaction
        - Recipes and discovery
        - Result contracts and handoffs
        - Validation and releases
        - Contribution design
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include only public-safe context needed to understand the question.
    validations:
      required: true
