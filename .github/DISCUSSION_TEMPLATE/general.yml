title: "General Discussion"
labels:
  - discussion
body:
  - type: markdown
    attributes:
      value: |
        Discuss SEO Agent Tools, public recipe methodology, or agent-facing SEO analysis.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Skill behavior and boundaries
        - SEO MCP interaction
        - Recipe methodology
        - Result contracts and handoffs
        - Validation and release
        - Community adoption
        - Other
    validations:
      required: true
  - type: textarea
    id: discussion
    attributes:
      label: Discussion
      description: Share public-safe context and the question or perspective you want to discuss.
    validations:
      required: true
