name: Question
description: Ask a focused question about SEO Agent Tools
labels:
  - question
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation or update
        - Skill activation or boundaries
        - SEO MCP routing
        - Recipe catalog
        - Result contracts or handoffs
        - Validation or release
        - Contribution design
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include public-safe context and the outcome you are trying to reach.
    validations:
      required: true
