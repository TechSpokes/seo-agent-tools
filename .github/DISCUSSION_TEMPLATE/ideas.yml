title: "Idea"
labels:
  - idea
body:
  - type: markdown
    attributes:
      value: |
        Share an early public idea for improving SEO Agent Tools. Use an issue when the proposal is concrete and actionable.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What SEO decision or maintenance task could be handled better?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: Describe the public behavior, recipe, contract, or validation change you are considering.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Share a public-safe representative case or observation that motivates the idea.
