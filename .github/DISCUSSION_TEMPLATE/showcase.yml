title: "Showcase"
labels:
  - showcase
body:
  - type: markdown
    attributes:
      value: |
        Share a public-safe use of SEO Agent Tools, a recipe evaluation, or an integration pattern.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What SEO decision or workflow did the skill support?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and boundaries
      description: What worked, what remained uncertain, and which private or customer details were removed?
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: Reusable learning
      description: What could other users or maintainers learn from this example?
