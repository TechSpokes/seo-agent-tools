name: Bug report
description: Report a reproducible skill, catalog, validation, packaging, or workflow defect
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime skill
        - Recipe catalog
        - Result schema
        - Behavioral fixture
        - Validation or projection
        - Installation or update
        - Release packaging or workflow
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the observed behavior without private server or customer material.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Public-safe output
      description: Remove credentials, private identities, local paths, customer data, and private server implementation.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - Operating system:
        - Node.js version:
        - Host and skill version:
        - Server-visible version metadata:
